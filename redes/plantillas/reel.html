<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fuentes/marca.css">
<style>
:root{--azul:#0B1E33;--amarillo:#FFC83D;--naranja:#FF8A3D;--cian:#5CE1E6;--rojo:#FF4D5A;--verde:#4ADE80}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1E33}
#lienzo{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'Instrument Sans',sans-serif;color:#fff}
#bg{position:absolute;inset:0;background:#0d2440}
.blob{position:absolute;width:1100px;height:1100px;border-radius:50%;filter:blur(40px);opacity:.75}
#b1{background:radial-gradient(circle,#2a6fd6 0%,transparent 65%)}
#b2{background:radial-gradient(circle,#FFC83D 0%,transparent 62%);opacity:.32}
#b3{background:radial-gradient(circle,#5CE1E6 0%,transparent 60%);opacity:.28}
#rojo{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 40%,#e01b33,#5a0711 75%);opacity:0}
#rayos{position:absolute;left:50%;top:700px;width:2600px;height:2600px;margin:-1300px 0 0 -1300px;opacity:.07;
  background:repeating-conic-gradient(from 0deg,#fff 0deg 5deg,transparent 5deg 15deg)}
#puntos{position:absolute;inset:-80px;background-image:radial-gradient(rgba(255,255,255,.10) 2.5px,transparent 2.5px);background-size:64px 64px}
#cam{position:absolute;inset:0;transform-origin:50% 42%}
#stage{position:absolute;left:0;right:0;top:230px;height:950px}
#prog{position:absolute;left:0;top:0;height:12px;background:linear-gradient(90deg,var(--amarillo),var(--naranja));box-shadow:0 0 20px rgba(255,200,61,.7);z-index:5}
#chip{position:absolute;left:70px;top:120px;font:800 30px 'JetBrains Mono',monospace;letter-spacing:.08em;background:var(--amarillo);color:var(--azul);padding:8px 18px;border-radius:8px;z-index:4;transform-origin:left center}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:9;pointer-events:none}
/* textos grandes */
.tit{position:absolute;left:60px;right:60px;text-align:center;font:800 118px/0.98 'Bricolage Grotesque',sans-serif;text-transform:uppercase;letter-spacing:-.02em;
  text-shadow:0 10px 0 rgba(0,0,0,.25),0 20px 50px rgba(0,0,0,.4)}
.tit .d{color:var(--amarillo)}
.tit .w{display:inline-block}
.emo{position:absolute;left:50%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.sello{position:absolute;font:800 120px 'Bricolage Grotesque';color:var(--rojo);border:12px solid var(--rojo);border-radius:28px;padding:6px 34px;
  background:rgba(255,255,255,.95);box-shadow:0 20px 50px rgba(0,0,0,.4);white-space:nowrap}
.num{position:absolute;left:0;right:0;text-align:center;font:800 330px/1 'Bricolage Grotesque';color:var(--amarillo);letter-spacing:-.04em;
  text-shadow:0 14px 0 #b9850c,0 30px 70px rgba(255,200,61,.35);white-space:nowrap}
.num small{font-size:150px;letter-spacing:0;margin-left:16px;color:#fff;text-shadow:0 10px 0 rgba(0,0,0,.25)}
.pie{position:absolute;left:80px;right:80px;text-align:center;font:700 50px/1.15 'Instrument Sans';color:#e8f0fb}
.pie b{background:var(--amarillo);color:var(--azul);padding:0 12px;border-radius:10px}
.pista{position:absolute;left:90px;right:90px;height:70px;border-radius:35px;background:rgba(255,255,255,.12);overflow:hidden;border:4px solid rgba(255,255,255,.25)}
.relleno{position:absolute;left:0;top:0;bottom:0;border-radius:35px;background:repeating-linear-gradient(-45deg,var(--amarillo) 0 30px,var(--naranja) 30px 60px)}
.item{position:absolute;left:90px;right:90px;display:flex;align-items:center;gap:34px;background:rgba(255,255,255,.96);color:var(--azul);border-radius:30px;
  padding:26px 34px;font:800 58px/1.05 'Bricolage Grotesque';box-shadow:0 16px 0 rgba(0,0,0,.18),0 30px 60px rgba(0,0,0,.35)}
.item img{width:110px;height:110px;flex:none}
.item small{display:block;font:600 34px 'Instrument Sans';color:#3d5270;margin-top:6px}
.confeti{position:absolute;width:22px;height:34px;border-radius:5px}
#term{position:absolute;left:50px;right:50px;top:150px;background:#060d18;border:3px solid #2a4767;border-radius:28px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.5)}
#term .barra{display:flex;align-items:center;gap:14px;padding:22px 28px;background:#15233a;font:600 30px 'JetBrains Mono',monospace;color:#8fa6c4}
#term .barra i{width:22px;height:22px;border-radius:50%;background:#FF5F57;display:inline-block}
#term .barra i:nth-child(2){background:#FEBC2E}#term .barra i:nth-child(3){background:#28C840}
#tcuerpo{padding:32px 34px 44px;font:600 42px/1.42 'JetBrains Mono',monospace;color:#E6EDF7;min-height:520px}
#tcuerpo .l{white-space:pre-wrap;word-break:break-word;margin-bottom:8px}
#tcuerpo .p{color:#5CE1E6;font-weight:800}
#tcuerpo .error{color:#FF6B6B}#tcuerpo .ok{color:#4ADE80}#tcuerpo .warn{color:#FFC83D}#tcuerpo .gris{color:#7E8FA8}
#tcuerpo .cur{display:inline-block;width:24px;height:46px;background:#E6EDF7;vertical-align:middle}
#emos{position:absolute;left:0;right:0;top:300px;height:420px;display:flex;justify-content:center;align-items:center;gap:30px}
#emos img,#emos .ssd{width:340px;height:340px;filter:drop-shadow(0 26px 34px rgba(0,0,0,.45))}
#emos.n2 img{width:300px;height:300px}#emos.n3 img{width:250px;height:250px}
#etiq{position:absolute;left:50%;top:760px;background:var(--amarillo);color:var(--azul);font:800 96px/1 'Bricolage Grotesque',sans-serif;text-transform:uppercase;
  padding:20px 44px;border-radius:20px;white-space:nowrap;box-shadow:0 14px 0 #c99410,0 24px 40px rgba(0,0,0,.35)}
.num.txt{font-size:250px}
/* subtítulos */
#caps{position:absolute;left:50px;right:50px;top:1215px;height:260px;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:4px 22px;z-index:6}
#caps .w{display:inline-block;font:800 92px/1.05 'Bricolage Grotesque';text-transform:uppercase;color:#fff;letter-spacing:-.01em;
  -webkit-text-stroke:10px #0B1E33;paint-order:stroke fill;text-shadow:0 10px 24px rgba(0,0,0,.55)}
#caps .w.on{color:var(--amarillo)}
#caps.jota .w.on{color:var(--cian)}
#quien{position:absolute;left:0;right:0;top:1180px;text-align:center;font:800 32px 'JetBrains Mono';color:var(--cian);letter-spacing:.2em;z-index:6}
/* mascota */
#jota{position:absolute;width:230px;height:276px;left:70px;top:1500px;z-index:5;transform-origin:50% 100%}
#marca{position:absolute;right:70px;top:120px;display:flex;align-items:center;gap:12px;font:800 32px 'Bricolage Grotesque';letter-spacing:.08em;z-index:4}
#marca img{height:46px}
#fuente{position:absolute;left:340px;right:70px;top:1560px;font:500 24px/1.3 'JetBrains Mono';color:#a9bad0;z-index:4}
#fuente b{color:var(--cian)}
#cierre{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0;z-index:7;
  background:radial-gradient(900px 900px at 50% 45%,#1d4f8f,#0B1E33 75%)}
#cierre h2{font:800 140px 'Bricolage Grotesque';letter-spacing:.06em}
#cierre p{font:800 64px/1.1 'Bricolage Grotesque';color:var(--amarillo);text-align:center;padding:0 90px;text-transform:uppercase}
#cierre .web{font:500 40px 'JetBrains Mono';color:#cfe0f5}
#cierre .btn{font:800 52px 'Bricolage Grotesque';background:var(--amarillo);color:var(--azul);padding:22px 56px;border-radius:999px;box-shadow:0 14px 0 #b9850c}
</style></head><body><div id="lienzo">
<div id="bg"><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div id="rojo"></div><div id="rayos"></div><div id="puntos"></div></div>
<div id="cam"><div id="stage"></div></div>
<div id="prog"></div>
<span id="chip"></span>
<div id="marca"><img src="icono-blanco.png" alt="">JAVERTIX</div>
<div id="quien"></div>
<div id="caps"></div>
<div id="fuente"></div>
<svg id="jota" viewBox="0 0 250 300"><g id="cuerpo">
  <line x1="125" y1="40" x2="125" y2="12" stroke="#8fb3e0" stroke-width="6" stroke-linecap="round"/>
  <circle id="antena" cx="125" cy="10" r="10" fill="#FFC83D"/>
  <rect x="20" y="40" width="210" height="160" rx="44" fill="#2a6fd6"/>
  <rect x="42" y="62" width="166" height="116" rx="30" fill="#0B1E33"/>
  <g id="ojos"><ellipse id="oi" cx="95" cy="112" rx="15" ry="19" fill="#5CE1E6"/><ellipse id="od" cx="155" cy="112" rx="15" ry="19" fill="#5CE1E6"/></g>
  <rect id="boca" x="105" y="146" width="40" height="6" rx="3" fill="#5CE1E6"/>
  <rect x="62" y="206" width="126" height="76" rx="26" fill="#2a6fd6"/>
  <text x="125" y="262" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="56" fill="#FFC83D">J</text>
  <rect id="bi" x="30" y="214" width="26" height="56" rx="13" fill="#1f58ad"/><rect id="bd" x="194" y="214" width="26" height="56" rx="13" fill="#1f58ad"/>
</g></svg>
<div id="cierre"><svg width="300" height="360" viewBox="0 0 250 300"><use href="#cuerpo"/></svg><h2>JAVERTIX</h2>
  <p id="cierreTxt"></p><span class="btn">SÍGUENOS</span><div class="web">javertix.site</div></div>
<div id="flash"></div>
</div>
<script>
const D = __DATOS__;
const $ = id => document.getElementById(id);
const cl = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const elas = x => { x = cl(x); if (x === 0 || x === 1) return x; return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * 2 * Math.PI / 3) + 1; };
const noise = (t, s) => Math.sin(t * 13.1 + s) * 0.5 + Math.sin(t * 27.7 + s * 2) * 0.3 + Math.sin(t * 41.3 + s * 3) * 0.2;
const SSD = `<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg"><rect x="10" y="40" width="480" height="220" rx="22" fill="#1b5e3a"/><rect x="10" y="40" width="480" height="220" rx="22" fill="none" stroke="#0f3d25" stroke-width="8"/>
<rect x="40" y="80" width="150" height="140" rx="10" fill="#111"/><rect x="215" y="80" width="110" height="140" rx="10" fill="#111"/><rect x="345" y="95" width="80" height="80" rx="8" fill="#222"/>
<rect x="60" y="100" width="110" height="34" rx="5" fill="#FFC83D"/><text x="115" y="126" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="28" fill="#0B1E33">SSD</text>
<text x="115" y="190" text-anchor="middle" font-family="JetBrains Mono" font-size="24" fill="#8fa6c4">1 TB</text>
<g fill="#E8C35A">${Array.from({length:9},(_,i)=>`<rect x="${448}" y="${70+i*20}" width="34" height="12" rx="3"/>`).join('')}</g><circle cx="30" cy="150" r="10" fill="#0f3d25"/></svg>`;
const IMG = (c, cls, id, st) => c === 'ssd' ? `<div class="${cls} ssd" ${id ? `id="${id}"` : ''} style="${st}">${SSD}</div>` : `<img class="${cls}" ${id ? `id="${id}"` : ''} src="emoji/${c}.svg" style="${st}" alt="">`;
const E = c => IMG(c, '', '', '');
const W = x => String(x || '').split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
const escH = x => String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;');
$('chip').textContent = D.etiqueta;
$('fuente').innerHTML = D.fuente ? '<b>FUENTE</b> ' + D.fuente : '';
let actual = -1, conf = [];

function construir(i) {
  const s = D.escenas[i], v = s.v, st = $('stage');
  let h = '';
  const grande = (c, top, w) => c ? IMG(c, 'emo', 'eGrande', `top:${top}px;width:${w}px;height:${c === 'ssd' ? w * .6 : w}px;margin-left:-${w / 2}px`) : '';
  const mini = (c, top, w) => c ? IMG(c, 'emo', 'eMini', `top:${top}px;width:${w}px;height:${c === 'ssd' ? w * .6 : w}px;margin-left:-${w / 2}px`) : '';
  if (v.tipo === 'gancho') {
    h = `<div class="tit" style="top:0px">${W(v.titulo)}${v.destacar ? '<br><span class="d">' + W(v.destacar) + '</span>' : ''}</div>`
      + grande(v.emoji, v.emoji === 'ssd' ? 380 : 330, v.emoji === 'ssd' ? 620 : 500)
      + (v.sello ? `<div class="sello" id="sello" style="left:560px;top:690px">${v.sello}</div>` : '');
  } else if (v.tipo === 'cifra' || v.tipo === 'barra') {
    const barra = v.tipo === 'barra';
    h = `<div class="pie" style="top:${barra ? 30 : 40}px">${v.antes || ''}</div>`
      + (barra ? `<div class="pista" style="top:170px"><div class="relleno" id="rell"></div></div>` : '')
      + `<div class="num${v.hasta == null ? ' txt' : ''}" id="num" style="top:${barra ? 330 : 250}px"></div><div class="pie" style="top:${barra ? 700 : 640}px">${v.pie || ''}</div>`
      + mini(v.emoji, barra ? 770 : 760, v.emoji === 'ssd' ? 300 : 200);
  } else if (v.tipo === 'alerta') {
    h = grande(v.emoji, 310, 420) + `<div class="tit" id="glitch" style="top:0px">${v.titulo}${v.destacar ? '<br><span class="d">' + v.destacar + '</span>' : ''}</div>`;
  } else if (v.tipo === 'lista') {
    h = `<div class="tit" style="top:0px;font-size:96px">${v.titulo}</div>` + v.puntos.map((p, k) =>
      `<div class="item" style="top:${250 + k * 250}px">${E(p.e)}<div>${p.t}${p.s ? '<small>' + p.s + '</small>' : ''}</div></div>`).join('');
  } else if (v.tipo === 'terminal') {
    h = (v.titulo ? `<div class="tit" style="top:10px;font-size:88px">${W(v.titulo)}</div>` : '')
      + `<div id="term" style="top:${v.titulo ? 190 : 110}px"><div class="barra"><i></i><i></i><i></i><span>${escH(v.ventana || 'bash')}</span></div><div id="tcuerpo"></div></div>`;
  } else if (v.tipo === 'escena') {
    const n = (v.emojis || []).length;
    h = (v.titulo ? `<div class="tit" style="top:0px;font-size:96px">${W(v.titulo)}${v.destacar ? '<br><span class="d">' + W(v.destacar) + '</span>' : ''}</div>` : '')
      + `<div id="emos" class="n${n}">${(v.emojis || []).map(E).join('')}</div>` + (v.etiqueta ? `<div id="etiq">${v.etiqueta}</div>` : '');
  }
  st.innerHTML = h;
  conf = [];
  if (v.ding) { // confeti
    for (let k = 0; k < 46; k++) { const d = document.createElement('div'); d.className = 'confeti';
      d.style.background = ['#FFC83D', '#5CE1E6', '#FF8A3D', '#4ADE80', '#fff'][k % 5]; st.appendChild(d);
      conf.push({ el: d, x: 540, y: 420, vx: (Math.random() - .5) * 1900, vy: -900 - Math.random() * 1300, r: Math.random() * 720 }); }
  }
}

function frame(t) {
  // escena actual
  let i = 0; D.escenas.forEach((s, k) => { if (t >= s.a - 0.06) i = k; });
  const s = D.escenas[i], v = s.v, dt = t - s.a;
  if (i !== actual) { actual = i; construir(i); }
  const cierre = v.tipo === 'cierre';
  // fondo vivo
  $('b1').style.transform = `translate(${-200 + Math.sin(t * .6) * 220}px,${300 + Math.cos(t * .5) * 260}px)`;
  $('b2').style.transform = `translate(${300 + Math.cos(t * .7) * 260}px,${-250 + Math.sin(t * .4) * 200}px)`;
  $('b3').style.transform = `translate(${100 + Math.sin(t * .9 + 2) * 300}px,${1100 + Math.cos(t * .6) * 200}px)`;
  $('rayos').style.transform = `rotate(${t * 8}deg)`;
  $('puntos').style.transform = `translate(${(t * 22) % 64}px,${(t * 14) % 64}px)`;
  const rojo = v.tipo === 'alerta' ? ease(dt / 0.15) : (i > 0 && D.escenas[i - 1].v.tipo === 'alerta' ? 1 - ease(dt / 0.3) : 0);
  $('rojo').style.opacity = rojo;
  // cámara: golpe de zoom al entrar + respiración + sacudida
  const golpe = i === 0 ? 0 : (1 - ease(dt / 0.32)) * 0.16;
  const resp = 1 + Math.min(dt, 6) * 0.012;
  let sx = 0, sy = 0, rot = Math.sin(t * .8) * 0.6;
  const sac = v.tipo === 'alerta' ? Math.max(0, 1 - dt / 0.9) : (v.tipo === 'gancho' && dt > .55 && dt < 1 ? (1 - (dt - .55) / .45) * .6 : 0);
  if (sac > 0) { sx = noise(t, 1) * 34 * sac; sy = noise(t, 5) * 26 * sac; rot += noise(t, 9) * 3 * sac; }
  $('cam').style.transform = `translate(${sx}px,${sy}px) scale(${resp + golpe}) rotate(${rot}deg)`;
  $('flash').style.opacity = i === 0 ? 0 : Math.max(0, .45 - dt * 3.5);
  $('prog').style.width = (100 * cl(t / D.total)) + '%';
  $('chip').style.transform = `scale(${1 + Math.max(0, .25 - dt) * .8})`;
  // animaciones de cada tipo
  if (v.tipo === 'gancho' || v.tipo === 'terminal' || v.tipo === 'escena') {
    document.querySelectorAll('.tit .w').forEach((w, k) => { const t0 = i === 0 ? t + 0.35 : dt; const kk = back((t0 - k * 0.05) / 0.3);
      w.style.transform = `translateY(${(1 - kk) * 120}px) scale(${0.5 + 0.5 * kk})`; w.style.opacity = cl((t0 - k * .05) / .12 + .4); });
    const e = $('eGrande'); const k = elas((i === 0 ? t + 0.45 : dt) / 0.8);
    if (e) e.style.transform = `scale(${0.4 + 0.6 * k}) rotate(${Math.sin(t * 3) * 8}deg) translateY(${Math.sin(t * 2.4) * 18}px)`;
    const se = $('sello'); if (se) { const ks = cl((dt - 0.55) / 0.18);
      se.style.opacity = ks > 0 ? 1 : 0; se.style.transform = `translate(-50%,-50%) rotate(-14deg) scale(${ks > 0 ? 2.4 - 1.4 * ease(ks) : 0})`; }
  }
  if (v.tipo === 'cifra' || v.tipo === 'barra') {
    const k = ease(dt / 0.85), val = v.hasta * k;
    if (v.oculto) { $('num').innerHTML = '¿?' + `<small>${v.unidad || ''}</small>`; } else if (v.hasta == null) { $('num').innerHTML = escH(v.cifra || '') + (v.unidad ? `<small>${v.unidad}</small>` : ''); } else {
    const dec = v.decimales || 0; const txt = val.toLocaleString('es-ES', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    $('num').innerHTML = (v.prefijo || '') + txt + `<small>${v.unidad || ''}</small>`; }
    const nm = $('num'); nm.style.fontSize = ''; let fs = parseInt(getComputedStyle(nm).fontSize); while (nm.scrollWidth > 1000 && fs > 120) { fs -= 10; nm.style.fontSize = fs + 'px'; }
    const p = 1 + (dt > .85 ? Math.max(0, .2 - (dt - .85)) * 1.0 : 0) + Math.sin(t * 5) * .012;
    $('num').style.transform = `scale(${(0.6 + 0.4 * back(dt / 0.5)) * p})`;
    document.querySelectorAll('#stage .pie').forEach((x, n) => { const kk = ease((dt - 0.1 - n * .25) / .3); x.style.opacity = kk; x.style.transform = `translateY(${(1 - kk) * 40}px)`; });
    const m = $('eMini'); if (m) { const km = back((dt - 0.6) / 0.4); m.style.transform = `scale(${Math.max(0, km)}) rotate(${Math.sin(t * 4) * 10}deg)`; }
    const r = $('rell'); if (r) { r.style.width = (v.oculto ? Math.max(3, 92 * ease(dt / 2.4)) : v.sigue ? 92 + 8 * ease(dt / .4) : Math.max(3, 100 * ease(dt / 1.1))) + '%'; r.style.backgroundPosition = `${t * 120}px 0`; }
  }
  if (v.tipo === 'alerta') {
    const e = $('eGrande'); e.style.transform = `scale(${back(dt / 0.35)}) rotate(${noise(t, 3) * 10}deg)`;
    const g = $('glitch'); const on = (Math.floor(t * 15) % 5 === 0) && dt < 1.5;
    g.style.textShadow = on ? '8px 0 #5CE1E6,-8px 0 #FF4D5A' : '0 10px 0 rgba(0,0,0,.25)';
    g.style.transform = `translateX(${on ? noise(t, 7) * 20 : 0}px) scale(${0.7 + 0.3 * back(dt / 0.3)})`;
  }
  if (v.tipo === 'lista') {
    const tt = document.querySelector('#stage .tit'); if (tt) tt.style.transform = `scale(${0.7 + 0.3 * back(dt / 0.35)})`;
    document.querySelectorAll('.item').forEach((it, k) => { const kk = back((dt - 0.25 - k * 0.6) / 0.4);
      it.style.transform = `translateX(${(1 - kk) * (k % 2 ? 900 : -900)}px) rotate(${(1 - kk) * (k % 2 ? 8 : -8)}deg)`;
      it.querySelector('img').style.transform = `rotate(${Math.sin(t * 3 + k) * 10}deg) scale(${1 + Math.sin(t * 4 + k) * .05})`; });
  }
  if (v.tipo === 'terminal') {
    const ls = v.lineas || [], dur = Math.max(1, (s.b - s.a) * 0.85);
    const pesos = ls.map(l => l.cmd != null ? Math.max(6, l.cmd.length) : 8), tot = pesos.reduce((a, b) => a + b, 0) || 1;
    let acc = 0, html = '', cursor = true;
    for (let k = 0; k < ls.length; k++) { const l = ls[k], a0 = acc / tot * dur, a1 = (acc + pesos[k]) / tot * dur; acc += pesos[k];
      const tt = i === 0 ? t + 0.6 : dt; if (tt < a0) break; const f = Math.min(1, (tt - a0) / (a1 - a0));
      if (l.cmd != null) { const n = Math.floor(l.cmd.length * f); html += '<div class="l"><span class="p">' + escH(v.prompt || '$') + '</span> ' + escH(l.cmd.slice(0, n)) + (f < 1 ? '<span class="cur"></span>' : '') + '</div>'; if (f < 1) cursor = false; }
      else if (f > 0.2) html += '<div class="l ' + (l.color || '') + '">' + escH(l.out || '') + '</div>'; }
    if (cursor) html += '<span class="cur" style="opacity:' + ((t * 2 | 0) % 2) + '"></span>';
    const tc = $('tcuerpo'); if (tc) tc.innerHTML = html;
    const tm = $('term'); if (tm) { const kk = back((i === 0 ? t + 0.4 : dt) / 0.35); tm.style.transform = `translateY(${(1 - kk) * 200}px) rotate(${(1 - kk) * -3}deg)`; }
  }
  if (v.tipo === 'escena') {
    [...$('emos').children].forEach((im, k) => { const ki = back(((i === 0 ? t + 0.5 : dt) - 0.12 * k) / 0.45);
      im.style.transform = `scale(${Math.max(0, ki)}) translateY(${Math.sin(t * 2.4 + k) * 14}px) rotate(${Math.sin(t * 1.6 + k) * 6}deg)`; });
    const et = $('etiq'); if (et) { const ke = back((dt - 0.35) / 0.4); et.style.transform = `translateX(-50%) rotate(-3deg) scale(${Math.max(0, i === 0 ? 1 : ke)})`; }
  }
  conf.forEach(c => { const tt = Math.max(0, dt - 0.8); const x = c.x + c.vx * tt * .5, y = c.y + c.vy * tt + 1500 * tt * tt;
    c.el.style.opacity = dt > 0.8 && tt < 2.2 ? 1 : 0; c.el.style.transform = `translate(${x}px,${y}px) rotate(${c.r + tt * 720}deg)`; });
  // subtítulos palabra a palabra
  const cap = $('caps'); let g = null;
  for (const x of D.grupos) if (t >= x.a - 0.04 && t <= x.b + 0.12) g = x;
  if (g && !cierre) {
    cap.className = g.voz === 'jota' ? 'jota' : '';
    if (cap.dataset.g !== String(g.a)) { cap.dataset.g = g.a; cap.innerHTML = g.ws.map(w => `<span class="w">${w.w.replace(/</g, '&lt;')}</span>`).join(''); }
    [...cap.children].forEach((el, k) => { const w = g.ws[k]; const kk = back((t - w.a + 0.03) / 0.16);
      el.style.opacity = t >= w.a - 0.03 ? 1 : 0; el.style.transform = `scale(${t >= w.a - .03 ? 0.6 + 0.4 * kk : .6}) rotate(${k % 2 ? 1.5 : -1.5}deg)`;
      el.classList.toggle('on', t >= w.a && t < w.b + 0.05); });
    $('quien').textContent = g.voz === 'jota' ? 'JOTA' : ''; cap.style.opacity = 1;
  } else { cap.style.opacity = 0; $('quien').textContent = ''; }
  // mascota
  const habla = s.voz === 'jota' && !cierre, j = $('jota');
  const nv = habla && s.niv ? (s.niv[Math.floor(dt * D.fps)] || 0) : 0;
  $('boca').setAttribute('height', 6 + nv * 34); $('boca').setAttribute('y', 146 - nv * 10);
  const parp = (t % 3.1) < 0.12 ? 0.1 : 1; $('oi').setAttribute('ry', 19 * parp); $('od').setAttribute('ry', 19 * parp);
  $('antena').setAttribute('fill', habla && nv > .2 ? '#5CE1E6' : '#FFC83D');
  const sube = habla ? back(dt / 0.35) : 0;
  $('bi').setAttribute('transform', habla ? `rotate(${-30 + Math.sin(t * 9) * 25} 43 214)` : '');
  j.style.transform = `translate(${sube * 20}px,${-sube * 40 + Math.sin(t * 3) * 10}px) scale(${1 + sube * .4}) rotate(${Math.sin(t * 2) * 4}deg)`;
  j.style.opacity = cierre ? 0 : 1;
  // cierre
  const ci = $('cierre');
  if (cierre) { $('cierreTxt').textContent = v.texto || ''; const k = ease(dt / .3); ci.style.opacity = k; ci.style.transform = `scale(${1.15 - .15 * k})`;
    ci.querySelector('.btn').style.transform = `scale(${1 + Math.sin(t * 7) * .05})`; } else ci.style.opacity = 0;
}
